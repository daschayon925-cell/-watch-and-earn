<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0B1322"/>
      <stop offset="100%" stop-color="#042017"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10B981" stroke-width="8" stroke-opacity="0.35"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Center Circle Base -->
  <circle cx="240" cy="256" r="148" fill="#0A1626" stroke="#10B981" stroke-width="6" stroke-opacity="0.5"/>
  <circle cx="240" cy="256" r="132" fill="#042017" fill-opacity="0.8"/>

  <!-- Play Symbol -->
  <path d="M 210 180 L 310 256 L 210 332 Z" fill="url(#playGrad)" filter="url(#glow)"/>

  <!-- Bangladesh Flag & Coin Accent Badge -->
  <g transform="translate(340, 130)">
    <circle cx="28" cy="28" r="38" fill="#05070B" stroke="#F59E0B" stroke-width="4"/>
    <circle cx="28" cy="28" r="30" fill="url(#goldGrad)"/>
    <!-- Coin symbol ৳ or $ -->
    <text x="28" y="38" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#05070B" text-anchor="middle">৳</text>
  </g>

  <!-- Bottom Brand Label -->
  <g transform="translate(256, 430)">
    <rect x="-105" y="-22" width="210" height="38" rx="19" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-width="2"/>
    <text x="0" y="3" font-family="'Outfit', sans-serif" font-size="19" font-weight="800" fill="#34D399" text-anchor="middle" letter-spacing="3">WATCH &amp; EARN</text>
  </g>
</svg>
