name: Build & Deploy to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Prepare static public_html bundle
        run: |
          mkdir -p cpanel_public
          cp -r dist/* cpanel_public/
          rm -f cpanel_public/server.js cpanel_public/dist.zip
          cp public/.htaccess cpanel_public/.htaccess 2>/dev/null || true

      - name: Check if cPanel FTP secrets are configured
        id: check_ftp
        env:
          FTP_SERVER_VAL: ${{ secrets.FTP_SERVER }}
          FTP_USER_VAL: ${{ secrets.FTP_USERNAME }}
          FTP_PASS_VAL: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER_VAL" ] && [ -n "$FTP_USER_VAL" ] && [ -n "$FTP_PASS_VAL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FTP secrets not configured yet. Build succeeded; skipping cPanel FTP upload."
          fi

      - name: Deploy built site to cPanel public_html via FTP
        if: steps.check_ftp.outputs.enabled == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./cpanel_public/
          server-dir: /public_html/
